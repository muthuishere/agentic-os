version: '3'

vars:
  BINARY: aos
  PKG: ./cmd/aos
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds: [task: check]

  build:
    desc: Build the binary for this machine into dist/
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/{{.BINARY}} {{.PKG}}

  cross:
    desc: Build for macOS, Windows, and Linux
    # The macOS window backend is CoreGraphics through cgo, so darwin targets
    # need CGO_ENABLED=1 and a toolchain that can emit that arch. Linux and
    # Windows backends are pure Go and build anywhere.
    cmds:
      - for: [darwin/arm64, darwin/amd64, windows/amd64, windows/arm64, linux/amd64, linux/arm64]
        cmd: |
          os=$(echo {{.ITEM}} | cut -d/ -f1); arch=$(echo {{.ITEM}} | cut -d/ -f2)
          ext=""; [ "$os" = windows ] && ext=".exe"
          cgo=0; [ "$os" = darwin ] && cgo=1
          CGO_ENABLED=$cgo GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version={{.VERSION}}" \
            -o dist/{{.BINARY}}-$os-$arch$ext {{.PKG}}

  test:
    desc: Run the test suite
    cmds: [go test ./...]

  check:
    desc: Vet, test, and lint the command registry
    cmds:
      - gofmt -l . | (! grep .)
      - go vet ./...
      # -short skips the end-to-end suite, which needs the other machines up.
      - go test -short ./...
      - go run {{.PKG}} commands --check

  e2e:
    desc: Run the end-to-end suite against the machines in test/e2e/config.json
    deps: [cross, build]
    cmds:
      - go test ./test/e2e/ -v -timeout 20m

  doctor:
    desc: Diagnose this machine
    cmds:
      - go run {{.PKG}} doctor

  link:
    desc: Install and symlink onto PATH at ~/muthu/pathextra
    deps: [install]
    cmds:
      # Symlink the installed binary, not dist/: dist is gitignored and cleaned,
      # so a link into it breaks the moment someone runs a fresh build.
      - |
        gobin="$(go env GOBIN)"; [ -z "$gobin" ] && gobin="$(go env GOPATH)/bin"
        ln -sf "$gobin/{{.BINARY}}" ~/muthu/pathextra/{{.BINARY}}
        printf '%s -> %s\n' "$(command -v {{.BINARY}})" "$gobin/{{.BINARY}}"

  install:
    desc: Install into GOBIN
    cmds:
      - go install -ldflags "-X main.version={{.VERSION}}" {{.PKG}}
